    /* =====================================================
       GENERATE JOB CARDS
    ===================================================== */

    function generateJobCards() {

        const container = document.querySelector(".job-cards");

        if (!container) {
            return;
        }

        container.innerHTML = "";

        jobData.forEach((job, index) => {

            const card = document.createElement("div");

            card.classList.add("job-card");

            card.innerHTML = `

            <div class="job-card-title">
                ${job.title}
            </div>

            <div class="job-card-subtitle">
                ${job.shortDesc}
            </div>

            <div class="job-detail-buttons">

                <span class="detail-button">
                    ${job.location}
                </span>

                <span class="detail-button">
                    ${job.duration}
                </span>

                <span class="detail-button">
                    ${job.experience}
                </span>

            </div>

            <button
                type="button"
                class="card-buttons"
                onclick="openModal(${index})"
            >
                View More
            </button>

        `;

            container.appendChild(card);

        });

    }


    /* =====================================================
       OPEN MODAL
    ===================================================== */

    function openModal(index) {

        const modal = document.getElementById("jobModal");
        const title = document.getElementById("modalTitle");
        const body = document.getElementById("modalBody");
        const applyButton = document.getElementById("modalApply");

        title.innerText = jobData[index].title;

        body.innerHTML = jobData[index].fullDesc;

        applyButton.href = jobData[index].applyLink;

        modal.style.display = "block";

        document.body.style.overflow = "hidden";

    }


    /* =====================================================
       CLOSE MODAL
    ===================================================== */

    function closeModal() {

        const modal = document.getElementById("jobModal");

        modal.style.display = "none";

        document.body.style.overflow = "auto";

    }


    /* =====================================================
       CLOSE ON OUTSIDE CLICK
    ===================================================== */

    window.addEventListener("click", function (event) {

        const modal = document.getElementById("jobModal");

        if (event.target === modal) {

            closeModal();

        }

    });


    /* =====================================================
       CLOSE WITH ESC KEY
    ===================================================== */

    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape") {

            const modal = document.getElementById("jobModal");

            if (modal.style.display === "block") {

                closeModal();

            }

        }

    });


    /* =====================================================
       LOAD JOB CARDS
    ===================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        generateJobCards
    );

</script>
